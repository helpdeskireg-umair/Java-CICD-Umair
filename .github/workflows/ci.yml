name: CI/CD Pipeline

# Trigger on every push to main and on all pull requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel stale runs on the same branch; the newest push wins
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build the project and run all tests
      - name: Build with Maven & run tests
        run: mvn clean verify --no-transfer-progress

      # 4. Upload the built JAR as an artifact so the deploy job can use it
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to VPS (only runs on push to main, after build passes)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-test                 # only runs if build-and-test passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # 1. Checkout code (needed for rsync / scp)
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Download the JAR built in the previous job
      - name: Download JAR artifact
        uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: target/

      # 3. Set up the SSH private key from GitHub Secrets
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # 4. Copy the JAR file to the VPS (glob in case the version changes)
      - name: Copy JAR to VPS
        run: |
          scp target/my-java-app-*.jar \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/my-java-app/app.jar

      # 5. Restart the systemd service on the VPS
      - name: Restart app on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo systemctl restart my-java-app"

      # 6. Confirm the app is actually up after the restart
      - name: Verify app is up
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "curl -sf http://127.0.0.1:8081/ >/dev/null && echo 'health check OK'"
